name: Android CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Lint & Test (Android Target 34/35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dynamic Guardian Zero-Hardcode Quality Gate
        run: |
          echo "Executing Zero-Hardcode & Dynamic Configuration Guardian Audit..."
          python scripts/verify_zero_hardcode.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Package Chrome Extension
        working-directory: extension
        run: |
          npm ci
          npm run build
          cd dist && zip -r ../../kids-extension-bundle.zip .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Execute Android Unit Test Suite
        working-directory: android
        run: |
          echo "Executing Unit Tests..."
          ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        working-directory: android
        run: |
          echo "Compiling Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Publish Automated GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing automated GitHub Release for latest build..."
          gh release delete latest --yes || true
          git push --delete origin latest || true
          gh release create latest \
            android/app/build/outputs/apk/debug/app-debug.apk#K.I.D.S-latest.apk \
            kids-extension-bundle.zip#K.I.D.S-extension-latest.zip \
            --title "K.I.D.S. (Latest Automated Build - Run #${{ github.run_number }})" \
            --notes "Automated continuous delivery build from commit ${{ github.sha }} on $(date -u '+%Y-%m-%d %H:%M:%S UTC')." \
            --prerelease

      - name: Upload Test Reports & APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-artifacts
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/
            kids-extension-bundle.zip
          retention-days: 7
