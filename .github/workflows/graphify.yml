name: Knowledge Graph Validation & Graphify Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'GEMINI.md'
      - 'prd.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-knowledge-graph:
    name: Extract, Cluster & Update Knowledge Graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Graphify Engine
        run: |
          pip install --upgrade graphifyy

      - name: Re-extract AST & Cluster Knowledge Graph
        run: |
          graphify extract . --code-only
          graphify cluster-only .

      - name: Verify Updated Graph Artifacts
        run: |
          python -c "
          import json, os
          graph_path = 'graphify-out/graph.json'
          assert os.path.exists(graph_path), 'graph.json missing!'
          data = json.load(open(graph_path, encoding='utf-8'))
          nodes = data.get('nodes', [])
          edges = data.get('edges', [])
          print(f'Knowledge Graph Verified: {len(nodes)} nodes, {len(edges)} edges')
          assert len(nodes) > 0, 'Knowledge Graph is empty!'
          "

      - name: Commit & Push Updated Knowledge Graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain graphify-out/)" ]; then
            git add graphify-out/
            git commit -m "chore(graphify): auto-update knowledge graph on commit [skip ci]"
            git push origin main
          else
            echo "Knowledge graph is already synchronized."
          fi

      - name: Upload Graph Visualization Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-visuals
          path: |
            graphify-out/graph.html
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          retention-days: 14
